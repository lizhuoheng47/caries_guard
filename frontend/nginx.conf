limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=api_connections_per_ip:10m;

server {
    listen 80;
    server_name _;

    # 明确指定前端构建产物目录，避免 SPA 回退到 index.html 时发生重定向循环。
    root /usr/share/nginx/html;
    index index.html;

    # 允许上传口腔影像；为 multipart 边界和附加字段预留少量空间。
    client_max_body_size 55m;
    limit_req_status 429;
    limit_conn_status 429;

    location /api/ {
        limit_req zone=api_per_ip burst=40 nodelay;
        limit_conn api_connections_per_ip 40;
        proxy_pass http://backend-java:8080;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
