spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/caries_biz?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${CARIES_REDIS_HOST:127.0.0.1}
      # docker-compose exposes the Redis container on host port 16379.
      port: ${CARIES_REDIS_PORT:16379}
  rabbitmq:
    host: ${CARIES_RABBIT_HOST:127.0.0.1}
    port: ${CARIES_RABBIT_PORT:5672}
    username: ${CARIES_RABBIT_USERNAME:guest}
    password: ${CARIES_RABBIT_PASSWORD:guest}
  mail:
    default-encoding: UTF-8
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  flyway:
    enabled: true
    locations: classpath:db/migration
    # The existing local development database was initialized from V001-V004
    # before Flyway history tracking was enabled. New empty schemas still run
    # every migration; non-empty legacy schemas are registered at V004 once.
    baseline-on-migrate: ${CARIES_FLYWAY_BASELINE_ON_MIGRATE:true}
    baseline-version: ${CARIES_FLYWAY_BASELINE_VERSION:4}
    baseline-description: ${CARIES_FLYWAY_BASELINE_DESCRIPTION:Legacy schema through V004}
    clean-disabled: ${CARIES_FLYWAY_CLEAN_DISABLED:true}
    clean-on-validation-error: ${CARIES_FLYWAY_CLEAN_ON_VALIDATION_ERROR:false}
  mvc:
    problemdetails:
      enabled: false

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

logging:
  pattern:
    level: "%5p [%X{traceId}]"
  level:
    # MySQL 9.7 is newer than the versions verified by the Flyway release
    # managed by Spring Boot 3.2. Keep the local warning configurable while
    # retaining strict Flyway validation and migration behavior.
    org.flywaydb.core.internal.database.base.Database: ${CARIES_FLYWAY_DATABASE_LOG_LEVEL:ERROR}

management:
  health:
    # Local development can run account and database workflows without the
    # optional infrastructure containers. Docker deployments keep their own
    # strict health checks in application-docker.yml.
    rabbit:
      enabled: ${CARIES_HEALTH_RABBIT_ENABLED:false}
    redis:
      enabled: ${CARIES_HEALTH_REDIS_ENABLED:false}

caries:
  security:
    jwt:
      secret: ${CARIES_JWT_SECRET:change-me-to-a-strong-secret-key-with-at-least-32-bytes}
      access-token-expire-seconds: ${CARIES_JWT_EXPIRE_SECONDS:7200}
    sensitive:
      crypto-secret: ${CARIES_CRYPTO_SECRET:change-me-to-a-strong-sensitive-crypto-secret}
      hash-secret: ${CARIES_HASH_SECRET:change-me-to-a-strong-sensitive-hash-secret}
  storage:
    provider: ${CARIES_STORAGE_PROVIDER:MINIO}
    endpoint: ${CARIES_MINIO_ENDPOINT:http://127.0.0.1:9000}
    access-key: ${CARIES_MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${CARIES_MINIO_SECRET_KEY:minioadmin}
    secure: ${CARIES_MINIO_SECURE:false}
    default-presign-expire-seconds: ${CARIES_STORAGE_PRESIGN_EXPIRE_SECONDS:900}
    auto-create-buckets: ${CARIES_STORAGE_AUTO_CREATE_BUCKETS:true}
    proxy-access-secret: ${CARIES_IMAGE_ACCESS_SECRET:change-me-to-a-strong-image-access-secret}
    buckets:
      image: ${CARIES_BUCKET_IMAGE:caries-image}
      visual: ${CARIES_BUCKET_VISUAL:caries-visual}
      report: ${CARIES_BUCKET_REPORT:caries-report}
      export: ${CARIES_BUCKET_EXPORT:caries-export}
  analysis:
    default-model-version: ${CARIES_ANALYSIS_MODEL_VERSION:caries-v1}
    callback-secret: ${CARIES_ANALYSIS_CALLBACK_SECRET:change-me-to-a-strong-analysis-callback-secret}
    callback-allowed-clock-skew-seconds: ${CARIES_ANALYSIS_CALLBACK_SKEW_SECONDS:300}
    messaging:
      mode: rabbit
      rabbit:
        exchange: ${CARIES_ANALYSIS_EXCHANGE:caries.analysis.exchange}
        requested-queue: ${CARIES_ANALYSIS_REQUESTED_QUEUE:caries.analysis.requested.queue}
        completed-queue: ${CARIES_ANALYSIS_COMPLETED_QUEUE:caries.analysis.completed.queue}
        failed-queue: ${CARIES_ANALYSIS_FAILED_QUEUE:caries.analysis.failed.queue}
        requested-routing-key: ${CARIES_ANALYSIS_REQUESTED_ROUTING_KEY:analysis.requested}
        completed-routing-key: ${CARIES_ANALYSIS_COMPLETED_ROUTING_KEY:analysis.completed}
        failed-routing-key: ${CARIES_ANALYSIS_FAILED_ROUTING_KEY:analysis.failed}
  password-reset:
    enabled: ${CARIES_PASSWORD_RESET_ENABLED:true}
    development-code-enabled: ${CARIES_PASSWORD_RESET_DEV_CODE_ENABLED:true}
    delivery-mode: ${CARIES_PASSWORD_RESET_DELIVERY_MODE:LOCAL}
    mail-from: ${CARIES_PASSWORD_RESET_MAIL_FROM:}
    code-ttl-minutes: ${CARIES_PASSWORD_RESET_CODE_TTL_MINUTES:10}
    max-attempts: ${CARIES_PASSWORD_RESET_MAX_ATTEMPTS:5}
