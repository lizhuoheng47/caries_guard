spring:
  application:
    name: caries-guard-backend
  profiles:
    active: local
  lifecycle:
    timeout-per-shutdown-phase: ${CARIES_SHUTDOWN_TIMEOUT:30s}
  jackson:
    time-zone: UTC
  servlet:
    multipart:
      # 单个影像最大 50 MB，请求总量额外预留 multipart 元数据空间。
      max-file-size: 50MB
      max-request-size: 55MB
banner:
    location: classpath:banner.txt
    charset: UTF-8

server:
  port: 8080
  shutdown: graceful
  tomcat:
    threads:
      max: ${CARIES_HTTP_MAX_THREADS:200}
      min-spare: ${CARIES_HTTP_MIN_SPARE_THREADS:20}
    max-connections: ${CARIES_HTTP_MAX_CONNECTIONS:8192}
    accept-count: ${CARIES_HTTP_ACCEPT_COUNT:200}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

caries:
  ai:
    database: ${CARIES_MYSQL_DATABASE_AI:caries_ai}
