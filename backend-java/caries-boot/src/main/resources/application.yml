spring:
  application:
    name: caries-guard-backend
  profiles:
    active: local
  jackson:
    time-zone: UTC
  servlet:
    multipart:
      # 单个影像最大 50 MB，请求总量额外预留 multipart 元数据空间。
      max-file-size: 50MB
      max-request-size: 55MB
banner:
    location: classpath:banner.txt
    charset: UTF-8

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

caries:
  ai:
    database: ${CARIES_MYSQL_DATABASE_AI:caries_ai}
